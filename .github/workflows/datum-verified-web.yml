name: datum-verified-web

on:
  push:
    branches: [main]
    paths:
      - deploy/datum-verified/web/**
      - .github/workflows/datum-verified-web.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/datum-verified/web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/yudikorsou/datum-verified:latest
            ghcr.io/yudikorsou/datum-verified:1.0.0
            ghcr.io/yudikorsou/datum-verified:${{ github.sha }}
