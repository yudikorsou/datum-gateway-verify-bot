name: telegram-docker

on:
  push:
    branches: [main]
    paths:
      - telegram/Dockerfile
      - telegram/package.json
      - telegram/package-lock.json
      - telegram/src/**
      - .github/workflows/telegram-docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: telegram
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/yudikorsou/datum-gateway-telegram-verify-bot:latest
            ghcr.io/yudikorsou/datum-gateway-telegram-verify-bot:${{ github.sha }}
