name: test

on:
  push:
  pull_request:

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  telegram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telegram/package-lock.json
      - run: npm ci
      - run: npm test
