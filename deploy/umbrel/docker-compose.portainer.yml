services:
  discord:
    image: ghcr.io/yudikorsou/datum-gateway-verify-bot:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID}"
      VERIFIED_ROLE_ID: "${VERIFIED_ROLE_ID}"
      SCAN_INTERVAL_HOURS: "24"
      SHARE_MAX_AGE_HOURS: "24"
      CONVOY_TREAT_ACTIVE_AS_DATUM: "true"
      DATABASE_PATH: "/data/bot.sqlite"
    volumes:
      - discord-data:/data
  telegram:
    image: ghcr.io/yudikorsou/datum-gateway-telegram-verify-bot:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      SCAN_INTERVAL_HOURS: "24"
      SHARE_MAX_AGE_HOURS: "24"
      CONVOY_TREAT_ACTIVE_AS_DATUM: "true"
      DATABASE_PATH: "/data/bot.sqlite"
    volumes:
      - telegram-data:/data
volumes:
  discord-data:
    name: datum-discord-data
  telegram-data:
    name: datum-telegram-data
