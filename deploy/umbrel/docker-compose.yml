# DATUM Gateway Discord + Telegram bots for Umbrel / Portainer.
# From this directory: docker compose --env-file .env up -d --build
#
# Layout (one repo):
#   datum-gateway-verify-bot/          Discord bot (repo root)
#   datum-gateway-verify-bot/telegram/ Telegram bot

name: datum-gateway-bots

services:
  discord:
    build:
      context: ../..
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      VERIFIED_ROLE_ID: ${VERIFIED_ROLE_ID}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      SHARE_MAX_AGE_HOURS: ${SHARE_MAX_AGE_HOURS:-24}
      CONVOY_TREAT_ACTIVE_AS_DATUM: ${CONVOY_TREAT_ACTIVE_AS_DATUM:-true}
      DATABASE_PATH: /data/bot.sqlite
    volumes:
      - discord-data:/data

  telegram:
    build:
      context: ../../telegram
    restart: unless-stopped
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      SHARE_MAX_AGE_HOURS: ${SHARE_MAX_AGE_HOURS:-24}
      CONVOY_TREAT_ACTIVE_AS_DATUM: ${CONVOY_TREAT_ACTIVE_AS_DATUM:-true}
      DATABASE_PATH: /data/bot.sqlite
    volumes:
      - telegram-data:/data

volumes:
  discord-data:
  telegram-data:
